# GENERATED by scripts/gen-compact.sh from config.toml - do not edit, edit config.toml and rerun.
# i3status-rust 0.40.x, trial bar for D3. Spec: docs/design/D3-i3status-rust/spec.md
icons_format = "<span color='#777777'>{icon}</span>"
[theme]
theme = "native"
[theme.overrides]
idle_fg = "#ffffff"
info_fg = "#777777"      # dim-icon
good_fg = "#66dd66"      # good
warning_fg = "#dddd66"   # degraded
critical_fg = "#dd6666"  # bad

[icons]
icons = "material-nf"
[icons.overrides]
cpu_freq = "\U000F095B"   # md-sine_wave (frequency); better than md-flash, distinct from the load gauge
gpu = "\U000F08AE"        # md-expansion_card
reboot = "\U000F0709"       # md-restart
ccusage = "\U000F0674"    # md-creation
disk_read = "R"
disk_write = "W"

[[block]]
block = "load"
merge_with_next = true
format = " $icon $1m.eng(w:4) $15m.eng(w:4) "
interval = 3
info = 0.25
warning = 0.25
critical = 0.5
[block.icons_overrides]
cogs = "\U000F029A"       # md-gauge

[[block]]
block = "temperature"
merge_with_next = true
chip = "k10temp-*"
inputs = ["Tctl", "Tccd1", "Tccd2"]
format = " $icon $max.eng(w:2) "
format_alt = " $icon $min.eng(w:2) $average.eng(w:2) $max.eng(w:2) "
interval = 2
good = 0
idle = 60
info = 60
warning = 70

[[block]]
block = "custom"
command = "~/projects/custom_barista/scripts/freq.sh"
json = true
interval = 2

[[block]]
block = "memory"
format = " $icon $mem_avail.eng(prefix:G,w:2) "
interval = 3
warning_mem = 97.8
critical_mem = 98.9

[[block]]
block = "custom"
command = "~/projects/custom_barista/scripts/gpu.sh"
json = true
interval = 2

[[block]]
block = "custom"
command = "~/projects/custom_barista/scripts/reboot-needed.sh"
json = true
interval = 60
hide_when_empty = true

[[block]]
block = "net"
merge_with_next = true
device = "^wl"
format = " $icon $ssid $signal_strength.eng(w:3) ^icon_net_up $speed_up.eng(prefix:k,w:3) ^icon_net_down $speed_down.eng(prefix:k,w:3) "
inactive_format = ""
missing_format = ""
interval = 2

[[block]]
block = "net"
device = "^en"
format = " $icon ^icon_net_up $speed_up.eng(prefix:k,w:3) ^icon_net_down $speed_down.eng(prefix:k,w:3) "
inactive_format = " $icon down "
missing_format = ""
interval = 2

[[block]]
block = "keyboard_layout"
merge_with_next = true
driver = "xkbevent"
format = " ^icon_keyboard $layout "
[block.mappings]   # keys are "layout (variant)"; xkbevent reports variant N/A
"us (N/A)" = "US"
"ru (N/A)" = "RU"
[[block.click]]
button = "left"
cmd = "xdotool key ISO_Next_Group"

[[block]]
block = "battery"
merge_with_next = true
format = " $icon $percentage.eng(w:3) "
missing_format = ""
interval = 60

[[block]]
block = "sound"
driver = "pulseaudio"   # follows the default sink; alsa driver spawned `alsactl monitor`, holding the HDA card open
format = " $icon {$volume.eng(w:3)|MUT} "
max_vol = 100
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
format = " ^icon_calendar $timestamp.datetime(f:'%a %Y-%m-%d') ^icon_time $timestamp.datetime(f:'%H:%M:%S') "
interval = 1
[[block.click]]
button = "left"
cmd = "~/scripts/open_calender.sh"
